<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAJI V8.3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#060a14;color:#fff}
h1{text-align:center;color:#00e5ff;letter-spacing:9px;margin:12px 0 2px;font-size:2.6em}
.sub{text-align:center;color:#4a5a7a;font-size:10px;letter-spacing:3px;margin-bottom:10px}
.top{display:flex;background:#10182c;border-top:2px solid #00e5ff}
.top div{flex:1;text-align:center;padding:14px 0;font-weight:900;color:#5a6a8a;font-size:12px}
.top div.on{color:#00e5ff;border-bottom:3px solid #00e5ff;background:#00e5ff12}
.box{margin:10px;background:#141f37;border:1px solid #223152;border-radius:18px;padding:14px;display:none}
.box.on{display:block}
input{width:100%;padding:14px;border-radius:12px;border:1.5px solid #24405a;background:#0a1223;color:#fff;outline:none}
.btn{width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(90deg,#00e5ff,#2a7fff);color:#000;font-weight:900;margin-top:10px}
.btn2{background:linear-gradient(90deg,#ff1744,#ff9100);color:#fff}
.btn3{background:#1e293b;border:1px solid #334155;color:#fff}
.row{display:flex;gap:8px;margin-top:10px}
.row a,.row button{flex:1}
.log{text-align:center;color:#00e5ff;font-size:13px;margin-top:8px}
video,audio{width:100%;border-radius:12px;margin-top:10px;background:#000}
.item{background:#0d152a;padding:10px;border-radius:12px;margin:8px 0;display:flex;gap:10px;align-items:center}
.big{font-size:22px;font-weight:900;color:#00e5ff;text-align:center;margin-top:10px}
.hist{background:#0a1223;padding:10px;border-radius:10px;margin:6px 0;font-size:13px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<h1>BAJI.DOWN</h1><div class="sub">V8.3 • VIDEO GALERIE + PARTAGER</div>

<div class="top">
<div id="tb-v" class="on" onclick="G('v')">VIDEO</div>
<div id="tb-m" onclick="G('m')">MP3 NOM</div>
<div id="tb-s" onclick="G('s')">SCAN</div>
<div id="tb-f" onclick="G('f')">FICHIERS</div>
</div>

<div id="b-v" class="box on">
<input id="vlink" placeholder="Colle lien TikTok / Insta / FB / YT">
<button class="btn" onclick="DL()">⬇️ TÉLÉCHARGER VIDEO</button>
<div id="vlog" class="log"></div>
<div id="vout"></div>
</div>

<div id="b-m" class="box">
<input id="mq" placeholder="Ex: Fally Se Yo">
<button class="btn" onclick="MP3()">🔍 CHERCHER MP3</button>
<div id="mlog" class="log"></div>
<div id="mout"></div>
</div>

<div id="b-s" class="box">
<button id="sb" class="btn btn2" onclick="SCAN()">🎤 SCANNER TITRE</button>
<div id="slog" class="log"></div>
<div id="stit" class="big"></div>
<div id="sact"></div>
</div>

<div id="b-f" class="box"><h3>📁 OFFLINE</h3><div id="fout"></div></div>

<script>
const TOKEN="50aa509900a71b813eae79709c44c1e9";
function G(id){
document.querySelectorAll('.box').forEach(b=>b.classList.remove('on'));
document.getElementById('b-'+id).classList.add('on');
document.querySelectorAll('.top div').forEach(t=>t.classList.remove('on'));
document.getElementById('tb-'+id).classList.add('on');
if(id=='f')loadHist();
}
function saveHist(n,u){let h=JSON.parse(localStorage.getItem('baji_hist')||'[]');h.unshift({name:n,url:u,date:new Date().toLocaleString()});localStorage.setItem('baji_hist',JSON.stringify(h.slice(0,20)));}
function loadHist(){let h=JSON.parse(localStorage.getItem('baji_hist')||'[]');let o=document.getElementById('fout');o.innerHTML=h.length?h.map(x=>`<div class="hist"><span>${x.name}<br><small style="color:#666">${x.date}</small></span><a href="${x.url}" target="_blank"><button class="btn" style="width:auto;padding:6px 10px;margin:0">Ouvrir</button></a></div>`).join(''):'<p style="color:#666;text-align:center">Aucun</p>';}

async function DL(){
let link=document.getElementById('vlink').value.trim();
let log=document.getElementById('vlog'), out=document.getElementById('vout');
if(!link){alert('Colle lien');return;}
log.innerText='Connexion...';out.innerHTML='';
let videoUrl=null;
let tryJson=async(u,o)=>{try{let r=await fetch(u,o);return await r.json();}catch(e){return null}};
let j1=await tryJson('https://tikwm.com/api/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:link})});
if(j1?.data) videoUrl=j1.data.play||j1.data.hdplay;
if(!videoUrl){let j2=await tryJson('https://api.tiklydown.eu.org/api/download?url='+encodeURIComponent(link)); if(j2?.video) videoUrl=j2.video.noWatermark||j2.video.watermark;}
if(!videoUrl){log.innerText='❌ Lien court vt - copie lien LONG';return;}
log.innerText='✅ VIDÉO PRÊTE';saveHist('VIDEO_'+Date.now(),videoUrl);
out.innerHTML=`
<video src="${videoUrl}" controls playsinline></video>
<a href="${videoUrl}" download="BAJI_VIDEO.mp4"><button class="btn" style="background:linear-gradient(90deg,#00e5ff,#00ffaa)">📲 SAUVER VIDEO GALERIE</button></a>
<button class="btn btn3" onclick="shareNow('${videoUrl}','BAJI_VIDEO.mp4')">🔗 PARTAGER VIDEO</button>
`;
}

async function MP3(){
let q=document.getElementById('mq').value.trim();
let log=document.getElementById('mlog'), out=document.getElementById('mout');
if(!q){alert('Tape nom');return;}
log.innerText='Recherche...';
try{let r=await fetch('https://pipedapi.kavin.rocks/search?q='+encodeURIComponent(q)+'&filter=music_songs');let d=await r.json();let list=d.items.slice(0,5);log.innerText='✅ '+list.length+' trouvés';out.innerHTML=list.map(i=>`<div class="item"><img src="${i.thumbnail}" width="56" style="border-radius:8px"><div style="flex:1"><b>${i.title.slice(0,35)}</b></div><button class="btn" style="width:auto;padding:8px 12px;margin:0" onclick="MP3DL('${i.url}')">MP3</button></div>`).join('');}catch(e){log.innerText='Erreur';}
}
async function MP3DL(url){
if(!url.includes('http')) url='https://www.youtube.com'+url;
let log=document.getElementById('mlog'), out=document.getElementById('mout');
log.innerText='Conversion...';
let r=await fetch('https://tikwm.com/api/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url})});
let j=await r.json();let au=j.data.music||j.data.play;saveHist('MP3_'+Date.now(),au);
log.innerText='✅ MP3 PRÊT';
out.innerHTML+=`<audio src="${au}" controls></audio><div class="row"><a href="${au}" download="BAJI.mp3"><button class="btn">📲 GALERIE</button></a><button class="btn btn3" onclick="shareNow('${au}','BAJI.mp3')">🔗 PARTAGER</button></div>`;
}

async function SCAN(){
let b=document.getElementById('sb'),lg=document.getElementById('slog'),ti=document.getElementById('stit'),ac=document.getElementById('sact');
ti.innerText='';ac.innerHTML='';lg.innerText='Micro...';
let stream=await navigator.mediaDevices.getUserMedia({audio:true});
let rec=new MediaRecorder(stream),ch=[];rec.ondataavailable=e=>ch.push(e.data);
rec.onstop=async()=>{
let blob=new Blob(ch,{type:'audio/webm'});lg.innerText='🎧 Analyse...';
let fd=new FormData();fd.append('file',blob,'s.webm');fd.append('api_token',TOKEN);
let r=await fetch('https://api.audd.io/',{method:'POST',body:fd});let j=await r.json();
if(j.result?.title){let full=(j.result.artist+' - '+j.result.title).toUpperCase();ti.innerText=full;ac.innerHTML=`<button class="btn" onclick="document.getElementById('mq').value='${j.result.artist} ${j.result.title}';G('m');MP3()">⬇️ TÉLÉCHARGER CE TITRE</button>`;lg.innerText='';}else{ti.innerText='NON TROUVÉ';lg.innerText='Monte volume';}
stream.getTracks().forEach(t=>t.stop());b.innerText='🎤 SCANNER TITRE';
};
rec.start();lg.innerText='🔴 8 SEC - JOUE FORT';b.innerText='🔴 ÉCOUTE...';setTimeout(()=>rec.stop(),8000);
}
async function shareNow(url,name){
try{
let res=await fetch(url);let blob=await res.blob();let file=new File([blob],name,{type:blob.type});
if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});}
else{await navigator.share({title:name,text:'Via BAJI.DOWN',url:url});}
}catch(e){ if(navigator.share) navigator.share({url:url}); else window.open(url,'_blank');}
}
loadHist();
</script>
</body>
</html>
