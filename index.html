<!DOCTYPE html>
<html lang="fr">
<head>

<title>BAJI.DOWN V6.1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#070a12;color:#fff;font-family:system-ui;text-align:center}
h1{color:#00e5ff;font-size:2.6em;letter-spacing:8px;margin-top:18px}
.sub{color:#555;font-size:.7em;letter-spacing:2px;margin-bottom:10px}
.tabs{display:flex;background:#111;border-top:2px solid #00e5ff;border-bottom:2px solid #00e5ff}

.bigTitle{font-size:2em;font-weight:900;color:#00e5ff;text-align:center;margin-top:15px}
.result{background:#0d1220;padding:12px;border-radius:12px;margin:8px 0;display:flex;gap:10px;align-items:center}
.result img{width:60px;height:60px;border-radius:8px;object-fit:cover}
video, audio{width:100%;border-radius:12px;margin-top:10px;background:#000}
</style>
</head>
<body>
<h1>BAJI.DOWN</h1><div class="sub">V6.1 FIX - TITRE SEUL + MP3 NOM</div>

<div class="tabs">
<div id="t-video" class="tab active" onclick="openTab('video')">VIDEO</div>
<div id="t-mp3" class="tab" onclick="openTab('mp3')">MP3 NOM</div>
<div id="t-scan" class="tab" onclick="openTab('scan')">SCAN 🎤</div>
<div id="t-files" class="tab" onclick="openTab('files')">FICHIERS</div>
</div>

<div id="video" class="card tabc">
<input id="vlink" placeholder="Colle lien TikTok / Insta / FB...">
<button class="btn" onclick="downloadVideo()">⬇️ TÉLÉCHARGER</button>
<p id="vstatus" style="text-align:center;color:#00e5ff;margin-top:8px"></p>
<div id="vpreview"></div>
</div>

<div id="mp3" class="card tabc" style="display:none">
<input id="mquery" placeholder="Tape nom: ex Fally Ipupa Se Yo">
<button class="btn" onclick="searchMP3()">🔍 RECHERCHER</button>
<p id="mstatus" style="text-align:center;color:#00e5ff;margin-top:8px"></p>
<div id="mresults"></div>

<div id="scan" class="card tabc" style="display:none">
<p style="text-align:center">Joue la musique près du téléphone</p>
<button id="micBtn" class="btn" style="background:linear-gradient(90deg,#ff0055,#ff8800);color:#fff" onclick="startScan()">🎤 SCANNER 8 SEC</button>
<p id="scanStatus" style="text-align:center;color:#888;margin-top:8px"></p>
<div id="scanTitle" class="bigTitle"></div>
<div id="scanAction" style="text-align:center;margin-top:10px"></div>
</div>

<div id="files" class="card tabc" style="display:none">
<p style="color:#666;text-align:center">Historique hors ligne bientôt</p>
</div>

<script>
const TIKWM="https://tikwm.com/api/";
const INV="https://inv.tux.pizza/api/v1/search?q=";

// FIX TABS - NE BLOQUE PLUS
function openTab(id){
document.querySelectorAll('.tabc').forEach(c=>c.style.display='none');
let target=document.getElementById(id);
if(target) target.style.display='block';
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
let tabBtn=document.getElementById('t-'+id);
if(tabBtn) tabBtn.classList.add('active');
}

async function downloadVideo(){
let link=document.getElementById('vlink').value.trim();
if(!link) return alert('Colle un lien');
let s=document.getElementById('vstatus'), p=document.getElementById('vpreview');
s.innerText='Extraction...'; p.innerHTML='';
try{
let r=await fetch(TIKWM,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:link})});
let j=await r.json();
let url=j.data.play||j.data.hdplay;
s.innerText='✅ Prêt';
p.innerHTML=`<video src="${url}" controls playsinline></video><a href="${url}" download="BAJI.mp4"><button class="btn">📲 ENREGISTRER DANS GALERIE</button></a>`;
}catch(e){s.innerText='❌ Erreur lien';}
}
