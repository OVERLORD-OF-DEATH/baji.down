<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAJI.DOWN V4 - SCAN + GALERIE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#070a12;color:#fff;font-family:system-ui;text-align:center}
h1{color:#00e5ff;font-size:2.5em;letter-spacing:8px;margin-top:20px;text-shadow:0 0 20px #00e5ff}
.tabs{display:flex;background:#111;border-top:2px solid #00e5ff;border-bottom:2px solid #00e5ff;margin:15px 0}
.tab{flex:1;padding:14px;font-weight:900;cursor:pointer;color:#666}.tab.active{color:#00e5ff;border-bottom:3px solid #00e5ff;background:#00e5ff11}
.card{background:#1a2238;border-radius:20px;padding:18px;margin:15px;border:1px solid #2a3a5a}
input{width:100%;padding:15px;border-radius:12px;border:2px solid #00e5ff44;background:#0d1220;color:#fff;outline:none}
.btn{width:100%;padding:16px;margin-top:12px;border:none;border-radius:12px;font-weight:900;font-size:1.1em;background:linear-gradient(90deg,#00e5ff,#0088ff);cursor:pointer}
.btn-scan{background:linear-gradient(90deg,#ff0055,#ff8800);animation:pulse 1.5s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
.history-item{background:#0d1220;padding:10px;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<h1>BAJI.DOWN</h1>
<p style="color:#667788;font-size:.9em;margin-bottom:5px">LE TÉLÉCHARGEUR DE KINSHASA • V4 GALERIE + SCAN</p>

<div class="tabs">
<div class="tab active" onclick="openTab('video',this)">VIDEO</div>
<div class="tab" onclick="openTab('mp3',this)">MP3</div>
<div class="tab" onclick="openTab('scan',this)">SCAN 🎤</div>
<div class="tab" onclick="openTab('files',this)">MES FICHIERS</div>
</div>

<div id="video" class="card tabc">
<input id="vlink" placeholder="Colle lien TikTok / Insta / FB / YouTube...">
<button class="btn" onclick="downloadVideo()">⬇️ TÉLÉCHARGER DANS GALERIE</button>
<p id="vstatus" style="margin-top:10px;color:#00e5ff"></p>
</div>

<div id="mp3" class="card tabc" style="display:none">
<input id="mlink" placeholder="Colle lien YouTube / TikTok...">
<button class="btn" onclick="downloadMP3()">🎵 TÉLÉCHARGER MP3 DANS GALERIE</button>
<p id="mstatus" style="margin-top:10px;color:#00e5ff"></p>
</div>

<div id="scan" class="card tabc" style="display:none">
<p style="margin-bottom:15px">Chante ou fais jouer la chanson près du micro</p>
<button id="micBtn" class="btn btn-scan" onclick="startScan()">🎤 SCANNER 5 SECONDES</button>
<p id="scanStatus" style="margin-top:15px"></p>
<div id="scanResult"></div>
</div>

<div id="files" class="card tabc" style="display:none">
<h3 style="margin-bottom:10px">Tes téléchargements</h3>
<div id="historyList"></div>
<button class="btn" style="background:#222;margin-top:15px" onclick="clearHistory()">Effacer l'historique</button>
</div>

<script>
const API_DOWN = "https://tikwm.com/api/";

function openTab(id, el){
document.querySelectorAll('.tabc').forEach(c=>c.style.display='none');
document.getElementById(id).style.display='block';
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
el.classList.add('active');
if(id==='files') loadHistory();
}

async function downloadVideo(){
let link=document.getElementById('vlink').value.trim();
if(!link) return alert('Colle un lien');
let s=document.getElementById('vstatus'); s.innerText='⏳ Extraction sans logo...';
try{
let r=await fetch(API_DOWN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:link})});
let j=await r.json();
let url=j.data.play || j.data.hdplay || j.data.wmplay;
if(!url) throw 'Lien non trouvé';
s.innerText='✅ Prêt ! Téléchargement...';
// FORCE DOWNLOAD vers galerie
forceDownload(url, 'BAJI_DOWN_video.mp4');
saveHistory('VIDEO', link, url);
s.innerText='✅ Envoyé dans Téléchargements / Galerie !';
}catch(e){s.innerText='❌ Erreur: '+e}
}

async function downloadMP3(){
let link=document.getElementById('mlink').value.trim();
if(!link) return alert('Colle un lien');
let s=document.getElementById('mstatus'); s.innerText='⏳ Conversion MP3...';
try{
let r=await fetch(API_DOWN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:link})});
let j=await r.json();
let url=j.data.music || j.data.play;
if(!url) throw 'Audio non trouvé';
forceDownload(url, 'BAJI_DOWN_audio.mp3');
saveHistory('MP3', link, url);
s.innerText='✅ MP3 dans Téléchargements / Musique !';
}catch(e){s.innerText='❌ Erreur: '+e}
}

function forceDownload(url, filename){
// Cette fonction force l'enregistrement dans la galerie
fetch(url).then(res=>res.blob()).then(blob=>{
let a=document.createElement('a');
a.href=URL.createObjectURL(blob);
a.download=filename;
a.click();
}).catch(()=>{
// Fallback si blob bloqué
window.open(url,'_blank');
});
}

// --- HISTORIQUE ---
function saveHistory(type, original, directUrl){
let h=JSON.parse(localStorage.getItem('baji_history')||'[]');
h.unshift({type, original, directUrl, date:new Date().toLocaleString()});
localStorage.setItem('baji_history', JSON.stringify(h.slice(0,50)));
}
function loadHistory(){
let h=JSON.parse(localStorage.getItem('baji_history')||'[]');
let list=document.getElementById('historyList');
if(h.length==0) list.innerHTML='<p style="color:#666">Aucun fichier encore</p>';
else list.innerHTML=h.map(i=>`<div class="history-item"><span><b>${i.type}</b><br><small>${i.date}</small></span><a href="${i.directUrl}" target="_blank" style="color:#00e5ff">Revoir</a></div>`).join('');
}
function clearHistory(){localStorage.removeItem('baji_history');loadHistory();}

// --- SCAN MICRO V4 ---
let mediaRecorder;
async function startScan(){
let btn=document.getElementById('micBtn');
let st=document.getElementById('scanStatus');
let resDiv=document.getElementById('scanResult');
try{
let stream=await navigator.mediaDevices.getUserMedia({audio:true});
mediaRecorder=new MediaRecorder(stream);
let chunks=[];
btn.innerText='🔴 J\'ÉCOUTE... 5s'; st.innerText='Approche la musique du téléphone...';
mediaRecorder.ondataavailable=e=>chunks.push(e.data);
mediaRecorder.onstop=async()=>{
let blob=new Blob(chunks,{type:'audio/wav'});
st.innerText='🎧 Analyse en cours...';
// ICI TU METTRAS TA CLE ACRCloud GRATUITE
// Pour l'instant on simule
resDiv.innerHTML=`<div style="margin-top:15px;background:#0d1220;padding:15px;border-radius:10px">
<p>✅ Son enregistré !</p>
<p style="font-size:.8em;color:#888;margin-top:10px">Pour activer la vraie reconnaissance, crée une clé gratuite sur <b>acrcloud.com</b> et je te branche le code. En attendant tu peux utiliser ce fichier audio pour le télécharger.</p>
<a href="${URL.createObjectURL(blob)}" download="scan_baji.wav" style="color:#00e5ff;display:block;margin-top:10px">⬇️ Télécharger mon enregistrement</a>
</div>`;
btn.innerText='🎤 SCANNER 5 SECONDES';
};
mediaRecorder.start();
setTimeout(()=>{mediaRecorder.stop(); stream.getTracks().forEach(t=>t.stop());},5000);
}catch(e){st.innerText='❌ Micro bloqué, autorise le micro dans Chrome';}
}
</script>
</body>
</html>
